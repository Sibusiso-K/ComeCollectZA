name: Keep alive

# Pings the live app every six hours. The health route reads the database, so the free Supabase project
# never sits idle long enough to pause. A failed run emails the repo owner, which doubles as an uptime alert.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health route
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 https://comecollectza.vercel.app/api/health; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30 seconds"
            sleep 30
          done
          exit 1
