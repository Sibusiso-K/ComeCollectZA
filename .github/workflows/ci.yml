name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Software composition analysis: fail on any known high or critical vulnerability.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run build
